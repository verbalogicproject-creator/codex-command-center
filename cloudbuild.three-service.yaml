steps:
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/web/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/command-center-web:${_IMAGE_TAG}
      - .

  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/api/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/command-center-api:${_IMAGE_TAG}
      - .

  - id: build-mcp
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/mcp/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/command-center-mcp:${_IMAGE_TAG}
      - .

  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: [build-web]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/command-center-web:${_IMAGE_TAG}

  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/command-center-api:${_IMAGE_TAG}

  - id: push-mcp
    name: gcr.io/cloud-builders/docker
    waitFor: [build-mcp]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/command-center-mcp:${_IMAGE_TAG}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/command-center-web:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/command-center-api:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/command-center-mcp:${_IMAGE_TAG}

substitutions:
  _REGION: me-west1
  _REPOSITORY: command-center
  _IMAGE_TAG: manual

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
