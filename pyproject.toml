[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "command-center-v3"
version = "0.1.0"
description = "Visual, evidence-backed memory for AI-assisted development"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "services/memory/FRONTMATTER_RAG_LICENSE",
]
authors = [{name = "Eyal Nof / Verbalogic"}]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "markdown-it-py>=4.0",
  "openai>=2.0",
  "Pillow>=11.0",
  "pydantic>=2.10",
  "PyYAML>=6.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
dense-acceleration = ["numpy>=2.0"]
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
where = ["services/memory"]

[tool.pytest.ini_options]
testpaths = ["services/memory/tests"]
pythonpath = ["services/memory"]
addopts = "-q"
